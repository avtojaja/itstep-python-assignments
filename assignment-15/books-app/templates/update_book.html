{% extends "base.html" %}

{% block content %}

<h2>Edit Book</h2>

<form method="POST">
    <label>Title</label>
    <input type="text" name="title" value="{{book.title}}">
    <br><br>
    <label>Author</label>
    <input type="text" name="author" value="{{book.author}}">
    <br><br>
    <label>Year</label>
    <input type="number" name="year" value="{{book.year}}">
    <br><br>
    <button type="submit">Update Book</button>
</form>

{% endblock %}
